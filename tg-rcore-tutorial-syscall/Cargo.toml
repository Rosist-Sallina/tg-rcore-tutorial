[package]
name = "rosist-sallina-tg-rcore-tutorial-syscall-t1l5"
description = "Student AI4OSE lab syscall crate for Chapter 8 of rCore Tutorial."
version = "0.0.1-preview.1"
edition = "2024"
authors = ["Rosist_Sallina <sallinarosist@gmail.com>"]
repository = "https://github.com/Rosist-Sallina/tg-rcore-tutorial"
homepage = "https://github.com/Rosist-Sallina/tg-rcore-tutorial/tree/test/tg-rcore-tutorial-syscall"
documentation = "https://docs.rs/rosist-sallina-tg-rcore-tutorial-syscall-t1l5"
license = "GPL-3.0"
readme = "README.md"
keywords = ["ai", "ai4ose", "kernel", "learning", "os"]
categories = ["no-std", "embedded"]

[dependencies]
spin = "0.9"
bitflags = "1.2"
tg-signal-defs = { package = "tg-rcore-tutorial-signal-defs", path = "../tg-rcore-tutorial-signal-defs", version = "0.4.8" }

[features]
kernel = []
user = []

[package.metadata.docs.rs]
targets = ["riscv64gc-unknown-none-elf"]
