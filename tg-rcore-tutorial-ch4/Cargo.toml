[package]
name = "rosist-sallina-tg-rcore-tutorial-T1L2"
description = "Student AI4OSE lab crate for Chapter 4 of rCore Tutorial: Address space management with SV39 virtual memory."
version = "0.0.1-preview.1"
edition = "2024"
authors = ["Rosist_Sallina <sallinarosist@gmail.com>"]
repository = "https://github.com/Rosist-Sallina/tg-rcore-tutorial"
homepage = "https://github.com/Rosist-Sallina/tg-rcore-tutorial/tree/test/tg-rcore-tutorial-ch4"
documentation = "https://docs.rs/rosist-sallina-tg-rcore-tutorial-T1L2"
license = "GPL-3.0"
readme = "README.md"
keywords = ["ai", "ai4ose", "kernel", "learning", "os"]
categories = ["no-std", "embedded"]
exclude = [
    "tg-user/**",
#    ".cargo/config.toml",
]

[features]
exercise = []
smp = ["tg-smp"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
xmas-elf = "0.8.0"
riscv = "0.10.1"

tg-sbi = { package = "rosist-sallina-tg-rcore-tutorial-sbi-t2l10", path = "../tg-rcore-tutorial-sbi", version = "0.0.1-preview.1" }
tg-linker = { package = "tg-rcore-tutorial-linker", path = "../tg-rcore-tutorial-linker", version = "0.4.8" }
tg-console = { package = "tg-rcore-tutorial-console", path = "../tg-rcore-tutorial-console", version = "0.4.8" }
tg-kernel-context = { package = "tg-rcore-tutorial-kernel-context", path = "../tg-rcore-tutorial-kernel-context", version = "0.4.8", features = ["foreign"] }
tg-kernel-alloc = { package = "tg-rcore-tutorial-kernel-alloc", path = "../tg-rcore-tutorial-kernel-alloc", version = "0.4.8" }
tg-kernel-vm = { package = "tg-rcore-tutorial-kernel-vm", path = "../tg-rcore-tutorial-kernel-vm", version = "0.4.8" }
tg-syscall = { package = "rosist-sallina-tg-rcore-tutorial-syscall-t1l5", path = "../tg-rcore-tutorial-syscall", version = "0.0.1-preview.1", features = ["kernel"] }
tg-smp = { package = "rosist-sallina-tg-rcore-tutorial-smp-t2l10", path = "../tg-rcore-tutorial-smp", version = "0.0.1-preview.1", optional = true }

[build-dependencies]
tg-linker = { package = "tg-rcore-tutorial-linker", path = "../tg-rcore-tutorial-linker", version = "0.4.8" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
